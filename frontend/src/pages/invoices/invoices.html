<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturas - Finanças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../../../assets/css/global.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto p-4 sm:p-6">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-6 gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span id="titulo-pagina-fatura" class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Total Cartões</span>
                    <button id="btn-censura" class="text-slate-400 hover:text-slate-600 transition">
                        <span id="icone-olho" class="material-symbols-outlined text-base">visibility</span>
                    </button>
                </div>
                <div class="flex items-baseline gap-1">
                    <span class="text-slate-500 font-medium text-xl">R$</span>
                    <span id="valor-total" class="valor-sensivel text-4xl font-bold text-slate-800">0,00</span>
                </div>
            </div>

            <!-- Filtro de Fatura / Mês -->
            <select id="filtro-fatura" class="bg-white border border-slate-200 text-slate-700 text-sm font-medium rounded-xl p-2.5 px-4 outline-none shadow-sm cursor-pointer hover:bg-slate-50 transition">
                <option value="atual">Fatura em Aberto (Atual)</option>
            </select>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card-financeiro p-0 h-[560px] flex flex-col">
                <div class="px-6 py-4 bg-slate-50 rounded-t-[14px] border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-semibold text-slate-700 text-sm">Lançamentos</h3>
                    <span id="contador-itens" class="text-xs text-slate-400">0 itens</span>
                </div>
                <div id="lista-transacoes" class="p-2 overflow-y-auto flex-1"></div>
            </div>

            <div class="card-financeiro p-6 h-[560px] flex flex-col">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0 mb-4">
                    <div class="flex items-center gap-2">
                        <h3 class="font-semibold text-slate-700 text-sm">Gastos por Categoria</h3>
                        <button onclick="window.abrirModalCategoria()" class="p-1 text-slate-400 hover:text-slate-700 rounded-lg transition flex items-center justify-center" title="Ver transações por categoria">
                            <span class="material-symbols-outlined text-lg">info</span>
                        </button>
                    </div>
                </div>

                <div id="chart-container" class="relative flex-1 w-full min-h-0">
                    <canvas id="chartCategorias"></canvas>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-categoria" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-xl p-6 max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0">
                <div>
                    <h3 class="font-bold text-slate-800 text-base">Lançamentos por Categoria</h3>
                    <p class="text-xs text-slate-400 font-medium mt-0.5">Visão detalhada agrupada da fatura</p>
                </div>
                <button onclick="window.fecharModalCategoria()" class="p-1 text-slate-400 hover:text-slate-700 rounded-lg">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="modal-categoria-lista" class="overflow-y-auto flex-1 my-3 space-y-4 pr-1"></div>
            <div class="pt-3 border-t border-slate-100 text-right shrink-0">
                <button onclick="window.fecharModalCategoria()" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium hover:bg-slate-700 transition">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./invoices.js"></script>
</body>
</html>
