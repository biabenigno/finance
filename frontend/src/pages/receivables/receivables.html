<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Receber - Finanças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../../../assets/css/global.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="header-container"></div>
    <!-- Container Principal -->
    <div class="max-w-6xl mx-auto p-4 sm:p-6">
        <!-- Cabeçalho -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
            <div class="flex-1">
                <p class="text-sm font-semibold text-slate-600 uppercase tracking-wide">Receitas de terceiros</p>
                <h1 class="text-2xl font-bold text-slate-800 mt-1">A Receber</h1>
                <p class="text-sm text-slate-600 mt-1">Acompanhe faturas compartilhadas e saldos informais.</p>
            </div>
            <button id="new-person-btn" class="mt-4 sm:mt-0 flex items-center gap-2 px-4 py-2 bg-sky-700 text-white rounded-lg hover:bg-sky-800 transition-colors">
                <span class="material-symbols-outlined text-lg">person_add</span>
                <span>Adicionar Pessoa</span>
            </button>
        </div>

        <!-- Grid de Pessoas -->
        <div id="receivable-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-8 text-slate-500">
                <p>Carregando pessoas...</p>
            </div>
        </div>
    </div>

    <!-- ====================================================================== -->
    <!-- Drawer de Detalhes da Pessoa -->
    <!-- ====================================================================== -->
    <div id="person-drawer" class="fixed top-0 right-0 h-screen max-w-3xl w-full transform translate-x-full transition-transform duration-300 bg-white shadow-2xl z-50 flex flex-col">
        <!-- Cabeçalho do Drawer -->
        <div class="flex items-center justify-between border-b border-slate-200 p-6">
            <div>
                <p class="text-xs font-semibold text-slate-600 uppercase tracking-wide">Detalhes</p>
                <h2 id="person-drawer-name" class="text-xl font-bold text-slate-800 mt-1">-</h2>
            </div>
            <button id="close-drawer-btn" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Conteúdo do Drawer -->
        <div id="person-drawer-content" class="flex-1 overflow-y-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Seção Cartão -->
            <div>
                <h3 class="text-lg font-bold text-slate-800 mb-4">Cartão</h3>
                
                <div class="mb-4">
                    <p class="text-2xl font-bold text-sky-700" id="card-total">R$ 0,00</p>
                </div>

                <div class="mb-4">
                    <label for="person-month" class="block text-sm font-semibold text-slate-700 mb-2">Fatura</label>
                    <select id="person-month" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <button id="card-search-btn" class="w-full mb-6 px-4 py-2 bg-sky-100 text-sky-700 font-semibold rounded-lg hover:bg-sky-200 transition-colors flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">add</span>
                    <span>Vincular Compra</span>
                </button>

                <div id="card-splits-list" class="space-y-3">
                    <!-- Compras vinculadas aparecerão aqui -->
                </div>
            </div>

            <!-- Seção Saldo Devedor -->
            <div>
                <h3 class="text-lg font-bold text-slate-800 mb-4">Saldo Devedor</h3>
                
                <div class="mb-4">
                    <p class="text-2xl font-bold text-sky-700" id="manual-total">R$ 0,00</p>
                </div>

                <div class="flex gap-2 mb-6">
                    <button id="manual-charge-btn" class="flex-1 px-4 py-2 bg-amber-100 text-amber-700 font-semibold rounded-lg hover:bg-amber-200 transition-colors flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-lg">add</span>
                        <span>Cobrança</span>
                    </button>
                    <button id="manual-payment-btn" class="flex-1 px-4 py-2 bg-green-100 text-green-700 font-semibold rounded-lg hover:bg-green-200 transition-colors flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-lg">remove</span>
                        <span>Pagamento</span>
                    </button>
                </div>

                <div id="manual-debts-list" class="space-y-3">
                    <!-- Lançamentos manuais aparecerão aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- ====================================================================== -->
    <!-- Modal: Nova Pessoa -->
    <!-- ====================================================================== -->
    <div id="person-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Nova Pessoa</h3>
            
            <div class="mb-4">
                <label for="new-person-name" class="block text-sm font-semibold text-slate-700 mb-2">Nome *</label>
                <input type="text" id="new-person-name" placeholder="Digite o nome da pessoa" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <div class="flex gap-3">
                <button class="person-modal-cancel flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors">Cancelar</button>
                <button id="person-modal-confirm" class="flex-1 px-4 py-2 bg-sky-700 text-white font-semibold rounded-lg hover:bg-sky-800 transition-colors">Cadastrar</button>
            </div>
        </div>
    </div>

    <!-- ====================================================================== -->
    <!-- Modal: Lançamento Manual -->
    <!-- ====================================================================== -->
    <div id="manual-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <h3 id="manual-modal-title" class="text-lg font-bold text-slate-800 mb-4">Adicionar Cobrança</h3>
            
            <div class="mb-4">
                <label for="manual-amount" class="block text-sm font-semibold text-slate-700 mb-2">Valor *</label>
                <input type="number" id="manual-amount" placeholder="0,00" min="0.01" step="0.01" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <div class="mb-4">
                <label for="manual-description" class="block text-sm font-semibold text-slate-700 mb-2">Descrição (opcional)</label>
                <input type="text" id="manual-description" placeholder="Digite uma descrição" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <input type="hidden" id="manual-type" value="charge">

            <div class="flex gap-3">
                <button class="manual-modal-cancel flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors">Cancelar</button>
                <button id="manual-modal-confirm" class="flex-1 px-4 py-2 bg-sky-700 text-white font-semibold rounded-lg hover:bg-sky-800 transition-colors">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ====================================================================== -->
    <!-- Modal: Vínculo de Compra -->
    <!-- ====================================================================== -->
    <div id="card-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <h3 id="card-modal-title" class="text-lg font-bold text-slate-800 mb-4">Compras da Fatura</h3>
            
            <!-- Seção Filtros (Cartão e Busca) -->
            <div id="card-search-section" class="mb-4 space-y-3">
                <div>
                    <label for="card-filter-select" class="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wider">Cartão</label>
                    <select id="card-filter-select" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="">Todos os cartões</option>
                    </select>
                </div>
                <div>
                    <label for="card-purchase-search" class="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wider">Buscar Compra (descrição ou valor)</label>
                    <input type="text" id="card-purchase-search" placeholder="Buscar por descrição ou valor (ex: 50 ou 50,00)..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
            </div>

            <!-- Seção Lista de Compras (visível quando listando) -->
            <div id="card-list-section" class="space-y-2 mb-4 max-h-60 overflow-y-auto">
                <p class="text-center text-slate-500 py-4">Carregando compras...</p>
            </div>

            <!-- Seção Formulário de Divisão (visível quando selecionada) -->
            <div id="card-split-section" class="hidden">
                <div class="mb-4 p-4 bg-slate-50 rounded-lg">
                    <p id="card-split-description" class="font-semibold text-slate-800"></p>
                    <p id="card-split-value" class="text-slate-600 text-sm mt-1"></p>
                    <p id="card-split-date" class="text-slate-600 text-sm"></p>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tipo de Divisão</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="split-type" value="integral" checked class="w-4 h-4">
                            <span class="text-slate-700">Integral (100%)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="split-type" value="partial" class="w-4 h-4">
                            <span class="text-slate-700">Parcial</span>
                        </label>
                    </div>
                </div>

                <div id="split-amount-section" class="hidden mb-4">
                    <label for="split-amount" class="block text-sm font-semibold text-slate-700 mb-2">Valor da Pessoa</label>
                    <input type="number" id="split-amount" placeholder="0,00" min="0.01" step="0.01" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div class="flex gap-3">
                    <button id="card-split-back" class="flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors">Voltar</button>
                    <button id="card-split-confirm" class="flex-1 px-4 py-2 bg-sky-700 text-white font-semibold rounded-lg hover:bg-sky-800 transition-colors">Confirmar</button>
                </div>
            </div>

            <!-- Seção Ações (visível quando listando) -->
            <div id="card-list-actions" class="flex gap-3">
                <button class="card-modal-cancel flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ====================================================================== -->
    <!-- Modal: Confirmação -->
    <!-- ====================================================================== -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6">
            <h3 id="confirm-title" class="text-lg font-bold text-slate-800 mb-2">Confirmação</h3>
            <p id="confirm-message" class="text-slate-600 mb-6">Tem certeza que deseja continuar?</p>
            
            <div class="flex gap-3">
                <button id="confirm-cancel" class="flex-1 px-4 py-2 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors">Cancelar</button>
                <button id="confirm-ok" class="flex-1 px-4 py-2 bg-rose-600 text-white font-semibold rounded-lg hover:bg-rose-700 transition-colors">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module" src="receivables.js"></script>
</body>
</html>
