<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Dados - Finanças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../../../assets/css/global.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header Dinâmico -->
    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Gerenciar Dados e Conexões</h1>
            <p class="text-xs text-slate-500 mt-1">Visualize suas contas conectadas e personalize o nome de exibição dos seus cartões.</p>
        </div>

        <div id="lista-cartoes-gerenciamento" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-slate-400 text-sm py-10 col-span-full text-center">Carregando cartões e conectores...</p>
        </div>
    </main>

    <!-- Modal de Edição de Nome -->
    <div id="modal-editar-cartao" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md p-6 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-base">Editar Nome do Cartão</h3>
                <button onclick="window.fecharModalEdicao()" class="p-1 text-slate-400 hover:text-slate-700 rounded-lg">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <input type="hidden" id="card-id-edit">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="card-name-input">Nome de Exibição</label>
                <input id="card-name-input" type="text" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-slate-400">
            </div>

            <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="window.fecharModalEdicao()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">
                    Cancelar
                </button>
                <button onclick="window.salvarNomeCartao()" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium hover:bg-slate-700 transition">
                    Salvar
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./cards.js"></script>
</body>
</html>
