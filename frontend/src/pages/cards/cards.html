<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Dados - Finanças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/assets/css/global.css">
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Gerenciar Cartões e Bancos</h1>
                <p class="text-xs text-slate-500 mt-1">Configure seus cartões, bancos conectores e inclua novas contas.
                </p>
            </div>
            <button onclick="window.abrirModalNovoCartao()"
                class="px-4 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-semibold hover:bg-slate-700 transition flex items-center gap-2 shadow-sm self-start sm:self-auto">
                <span class="material-symbols-outlined text-base">add</span> Novo Cartão
            </button>
        </div>

        <div id="lista-cartoes-gerenciamento" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-slate-400 text-sm py-10 col-span-full text-center">Carregando cartões e conectores...</p>
        </div>
    </main>

    <!-- Modal Editar Cartão -->
    <div id="modal-editar-cartao"
        class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md p-6 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-base">Editar Dados do Cartão</h3>
                <button onclick="window.fecharModalEdicao()" class="p-1 text-slate-400 hover:text-slate-700 rounded-lg">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <input type="hidden" id="card-id-edit">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="bank-name-input">Nome do Banco /
                    Conector</label>
                <input id="bank-name-input" type="text"
                    class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-slate-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1" for="card-name-input">Nome de Exibição do
                    Cartão</label>
                <input id="card-name-input" type="text"
                    class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-slate-400">
            </div>

            <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="window.fecharModalEdicao()"
                    class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancelar</button>
                <button onclick="window.salvarDadosCartao()"
                    class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium hover:bg-slate-700 transition">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Novo Cartão em 2 Etapas -->
    <div id="modal-novo-cartao"
        class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md p-6 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-base">Conectar Novo Cartão</h3>
                <button onclick="window.fecharModalNovoCartao()"
                    class="p-1 text-slate-400 hover:text-slate-700 rounded-lg">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- Passo 1: Inserir Item ID -->
            <div id="passo-1-item-id" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1" for="input-item-id">Pluggy Item ID
                        *</label>
                    <input id="input-item-id" type="text" placeholder="Cole aqui o Item ID da Pluggy (ex: bd94446b...)"
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-slate-400 font-mono text-xs">
                </div>
                <button onclick="window.buscarCartoesDoItem()" id="btn-buscar-cartoes"
                    class="w-full py-2.5 bg-slate-800 text-white rounded-xl text-xs font-semibold hover:bg-slate-700 transition flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-base">search</span> Buscar Cartões Vinculados
                </button>
            </div>

            <!-- Passo 2: Seleção e Confirmação do Cartão (Oculto inicialmente) -->
            <div id="passo-2-selecao-cartao" class="hidden space-y-3">
                <div
                    class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">
                    <span class="material-symbols-outlined text-base shrink-0">check_circle</span>
                    <span>Cartões encontrados com sucesso! Selecione o que deseja vincular:</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1" for="select-cartao-encontrado">Cartão
                        de Crédito *</label>
                    <select id="select-cartao-encontrado"
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none bg-white font-medium text-slate-700"></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1" for="new-bank-name">Nome do Banco /
                        Conector *</label>
                    <input id="new-bank-name" type="text"
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-slate-400">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1" for="new-card-name">Nome de Exibição
                        do Cartão *</label>
                    <input id="new-card-name" type="text"
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-slate-400">
                </div>

                <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
                    <button onclick="window.voltarParaPasso1()"
                        class="text-xs text-slate-500 hover:text-slate-800 font-medium">Voltar</button>
                    <button onclick="window.criarNovoCartao()"
                        class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium hover:bg-slate-700 transition">Salvar
                        Cartão</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./cards.js"></script>
</body>

</html>
